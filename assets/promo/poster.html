<!doctype html><meta charset="utf-8"><style>@font-face{font-family:g;src:url('/fonts/Galmuri11-Bold.woff2')}*{box-sizing:border-box}body{margin:0;width:1080px;height:1350px;background:#241c2b;color:#fff0d5;font-family:g,sans-serif;padding:54px;display:flex;flex-direction:column;gap:24px}small{font-size:34px;color:#efc374}h1{font-size:60px;line-height:1.4;margin:0;word-break:keep-all}#art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}#art img{max-height:100%;max-width:100%;object-fit:contain}footer{font-size:32px;color:#d4c3b0;line-height:1.65}.scene{width:972px;height:350px;overflow:hidden;position:relative;border:2px solid #efc374}.scene img{position:absolute;width:1944px!important;max-width:none!important;max-height:none!important;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated}.shots{display:flex;gap:24px;flex-direction:column}</style><small>토비 용사단 · 개발 중</small><h1 id="title"></h1><div id="art"></div><footer id="caption"></footer><script>const kind=new URLSearchParams(location.search).get('kind'),t=document.getElementById('title'),a=document.getElementById('art'),c=document.getElementById('caption');if(kind==='intro'){t.textContent='작은 마을의 신이 된다면';a.innerHTML='<img src="./source/toby-keyart-web-v1.png" alt="토비 홍보 시안">';c.textContent='새 홍보 콘셉트아트 · 실제 플레이 화면 아님'}else if(kind==='kong'){t.textContent='콩이에게 표정이 더 생겼어';a.innerHTML='<img src="./source/kong-reactions-native-v1.png" alt="콩이 감정 시안">';c.textContent='새 감정 동작 시안 · 게임 적용 전 검수 중'}else{t.textContent='한 층에 퍼지는 초록 회복';a.innerHTML='<div class="shots"><div class="scene"><img src="./source/healing-early.png"></div><div class="scene"><img src="./source/healing-rise.png"></div></div>';c.textContent='실제 엔진 권능 시험 장면 · 두 시점 캡처'}document.fonts.ready.then(()=>document.body.dataset.ready='true')</script>
